# Builds the game on every push to main and publishes it two ways, so the site works whichever
# Pages source the repository is set to:
#   1. commits the production build to the repository root (index.html + assets/), which is what
#      "Deploy from a branch" (main, /) serves;
#   2. deploys dist/ through the Pages Actions API, which is what "GitHub Actions" serves.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish the build to the repository root
        run: |
          rm -rf assets
          cp -r dist/assets assets
          cp dist/index.html index.html
          # Static files from public/ (logo, icons) land at the dist root too. Never copy
          # markdown: a README in public/ must not replace the repository README.
          find dist -maxdepth 1 -type f ! -name index.html ! -name '*.md' -exec cp {} . \;
          touch .nojekyll
          git add -A assets index.html .nojekyll
          find dist -maxdepth 1 -type f ! -name index.html ! -name '*.md' -printf '%f\n' | xargs -r git add --
          if git diff --cached --quiet; then
            echo "Build output unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish production build [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
